name: 00 · Inspect server (read-only)

# Manual only. NEVER writes, installs, restarts or stops anything.
on:
  workflow_dispatch:

concurrency:
  group: giftipay-inspect
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: [self-hosted]
    timeout-minutes: 12
    steps:
      - name: Identity and privileges
        run: |
          echo "runner=${RUNNER_NAME} user=$(whoami) groups=$(id -Gn)"
          echo "sudo(n): $(sudo -n true 2>/dev/null && echo YES || echo NO)"
          echo "--- does a giftipay user/group already exist? ---"
          id giftipay 2>/dev/null || echo "user 'giftipay': does not exist"
          getent group caddy postgres 2>/dev/null || true

      - name: Caddy layout (config structure, secrets redacted)
        run: |
          echo "::group::caddy binary + service"
          caddy version 2>/dev/null || echo "(caddy not on PATH for this user)"
          systemctl cat caddy.service 2>/dev/null | grep -vE "^\s*#" | head -30 || echo "(cannot read unit)"
          echo "::endgroup::"
          echo "::group::caddy config files"
          ls -la /etc/caddy/ 2>/dev/null || echo "(cannot list /etc/caddy)"
          echo "--- import directives / site blocks (values redacted) ---"
          if [ -r /etc/caddy/Caddyfile ]; then
            sed -E 's/(password|hash|token|secret|key)[[:space:]]+\S+/\1 <redacted>/Ig' /etc/caddy/Caddyfile | head -80
          else
            echo "(/etc/caddy/Caddyfile not readable by $(whoami))"
          fi
          echo "--- any sites/conf.d style dir ---"
          ls -la /etc/caddy/conf.d /etc/caddy/sites 2>/dev/null || echo "(no conf.d/sites dir)"
          echo "::endgroup::"
          echo "::group::what caddy serves right now (admin API is localhost-only)"
          curl -s -m 5 http://127.0.0.1:2019/config/apps/http/servers 2>/dev/null \
            | head -c 2500 | sed -E 's/("password"|"hash"|"token"|"secret")[[:space:]]*:[[:space:]]*"[^"]*"/\1:"<redacted>"/Ig' \
            || echo "(admin API not reachable)"
          echo
          echo "::endgroup::"

      - name: CineFlow footprint (read-only; nothing touched)
        run: |
          echo "::group::cineflow units"
          for u in cineflow.service cineflow-backup.service cineflow-backup.timer cineflow-log-retention.service cineflow-log-retention.timer; do
            echo "== $u"
            systemctl show "$u" -p Description -p User -p Group -p WorkingDirectory -p ExecStart -p Environment -p EnvironmentFile 2>/dev/null \
              | sed -E 's/(PASSWORD|SECRET|TOKEN|KEY|DSN|URL)=[^ ]*/\1=<redacted>/Ig' | head -12
          done
          echo "::endgroup::"
          echo "::group::cineflow dirs (paths only)"
          ls -la /opt/ai.Company 2>/dev/null | head -20 || echo "(not readable by $(whoami) — good, it is isolated)"
          ls -la /var/www/cineflow-maint 2>/dev/null | head -10 || true
          echo "::endgroup::"

      - name: PostgreSQL access model
        run: |
          echo "::group::pg"
          psql --version
          echo "--- can gift-runner connect at all? ---"
          PGCONNECT_TIMEOUT=5 psql -h 127.0.0.1 -U "$(whoami)" -d postgres -tAc "select current_user" 2>&1 | head -3
          echo "--- hba auth methods (no addresses/users leaked beyond method) ---"
          (sudo -n cat /etc/postgresql/*/main/pg_hba.conf 2>/dev/null | grep -vE "^\s*#|^\s*$" | head -15) \
            || echo "(pg_hba.conf needs root — expected)"
          echo "--- cluster info ---"
          ls -1 /etc/postgresql/ 2>/dev/null || true
          echo "::endgroup::"

      - name: Ports free for the gift app
        run: |
          echo "::group::port availability"
          for p in 4020 4021 4030; do
            if (ss -tln 2>/dev/null | grep -q ":$p "); then echo "port $p: IN USE"; else echo "port $p: free"; fi
          done
          echo "--- full listen table for reference ---"
          ss -tln 2>/dev/null | head -20
          echo "::endgroup::"

      - name: DNS and current answer for the target domain
        run: |
          echo "::group::dns"
          getent hosts gift.historyfaster52.sbs || echo "(no A record resolved from server)"
          echo "server public IP:"; curl -s -m 6 https://api.ipify.org 2>/dev/null || echo "(cannot reach ipify)"
          echo
          echo "::endgroup::"
          echo "::group::what answers for the gift domain today"
          curl -sk -o /dev/null -w "  https via Host header -> %{http_code}\n" -m 8 -H "Host: gift.historyfaster52.sbs" https://127.0.0.1/ 2>/dev/null || echo "  (no answer)"
          curl -s  -o /dev/null -w "  http  via Host header -> %{http_code}\n" -m 8 -H "Host: gift.historyfaster52.sbs" http://127.0.0.1/  2>/dev/null || echo "  (no answer)"
          echo "::endgroup::"

      - name: Resources and toolchain
        run: |
          echo "node=$(node -v) npm=$(npm -v)"
          free -m | head -2
          df -h / | tail -1
          echo "swap: $(free -m | awk '/Swap/{print $2}') MB"
